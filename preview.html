<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview: podcast-5</title>
  <style>
    :root {
      --bg: #090b10;
      --panel: #11151f;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #ffe600;
      --blue: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: #232a3b;
      color: var(--accent);
      font-weight: 800;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    h1 { font-size: 18px; font-weight: 700; }
    
    .res-bar {
      display: flex;
      background: #0d1017;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }
    .res-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .res-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .res-btn.active {
      background: var(--blue);
      color: #fff;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .viewer-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .frame-container {
      width: 360px;
      height: 640px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
      position: relative;
    }
    .frame-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hud-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      color: var(--accent);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Timeline beats buttons */
    .beats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      width: 100%;
    }
    .beat-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .beat-btn:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .beat-btn.active {
      border-color: var(--accent);
      background: rgba(255, 230, 0, 0.08);
    }
    .beat-time {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      font-family: monospace;
    }
    .beat-title {
      font-size: 13px;
      font-weight: 600;
    }
    .beat-desc {
      font-size: 11px;
      color: var(--muted);
    }

    /* Audio section */
    .audio-card {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .audio-meta {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .pill {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .pill.green { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }

    /* Contact sheet */
    .contact-sheet-wrap {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .contact-sheet-img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .cmd-box {
      background: #0d1017;
      padding: 12px 16px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      width: 100%;
    }
    .copy-btn {
      background: #232a3b;
      border: none;
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .copy-btn:hover { background: var(--blue); }
  </style>
</head>

    let currentRes = '1/4';
    let currentIdx = 0;

    function setRes(res) {
      if (!framesData[res]) {
        alert('Resolution ' + res + ' was not generated in this run. Run with --res all or --res ' + res);
        return;
      }
      currentRes = res;
      document.querySelectorAll('.res-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.includes(res));
      });
      updateFrame();
      updateContactSheet();
    }

    function selectBeat(idx) {
      currentIdx = idx;
      document.querySelectorAll('.beat-btn').forEach((b, i) => {
        b.classList.toggle('active', i === idx);
      });
      updateFrame();
    }

    function updateFrame() {
      const list = framesData[currentRes] || Object.values(framesData)[0];
      if (!list || !list[currentIdx]) return;
      const f = list[currentIdx];
      document.getElementById('main-frame').src = f.file;
      document.getElementById('hud-txt').textContent = f.time + 's · ' + currentRes + ' (' + f.width + 'x' + f.height + ')';
    }

    function updateContactSheet() {
      const cs = contactSheets[currentRes] || Object.values(contactSheets)[0];
      if (cs) {
        document.getElementById('cs-img').src = cs;
      }
    }

    function initBeats() {
      const cont = document.getElementById('beats-container');
      beats.forEach((b, idx) => {
        const btn = document.createElement('button');
        btn.className = 'beat-btn' + (idx === 0 ? ' active' : '');
        btn.onclick = () => selectBeat(idx);
        btn.innerHTML = '<div class="beat-time">' + b.t + 's</div>' +
                        '<div class="beat-title">' + b.title + '</div>' +
                        '<div class="beat-desc">' + b.desc + '</div>';
        cont.appendChild(btn);
      });
    }

    initBeats();
    setRes(currentRes);
