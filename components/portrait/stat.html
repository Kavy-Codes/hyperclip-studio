<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    #stat{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;pointer-events:none;color:#f4f1ea;font-family:Inter,Arial,sans-serif}
    #stat .wrap{position:absolute;left:90px;right:150px;top:620px}
    #stat .number{font-size:250px;line-height:.9;letter-spacing:-12px;font-weight:800;color:#b9f27c}
    #stat .label{margin-top:26px;font-size:42px;line-height:1.25;font-weight:700;max-width:780px}
    #stat .source{margin-top:22px;font:20px "Courier New",monospace;letter-spacing:2px;color:#7f8d86;text-transform:uppercase}
  </style>
</head>
<body>
  <div id="stat" data-composition-id="stat" data-start="0" data-duration="8" data-width="1080" data-height="1920">
    <div class="wrap">
      <div class="number" data-slot="number">3×</div>
      <div class="label" data-slot="label">The result in one line.</div>
      <div class="source" data-slot="source">Source: UNKNOWN</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.from('#stat .number', { autoAlpha: 0, y: 24, scale: .94, duration: .7, ease: 'back.out(1.6)' }, 0);
    tl.from('#stat .label', { autoAlpha: 0, y: 18, duration: .55, ease: 'power2.out' }, .25);
    tl.from('#stat .source', { autoAlpha: 0, duration: .4 }, .55);
    tl.set({}, {}, 8);
    window.__timelines['stat'] = tl;
  </script>
</body>
</html>
