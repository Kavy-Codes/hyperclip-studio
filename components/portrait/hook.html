<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    #hook{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;pointer-events:none;color:#f4f1ea;font-family:Inter,Arial,sans-serif}
    #hook .wrap{position:absolute;left:90px;right:150px;top:220px}
    #hook .kicker{font:24px "Courier New",monospace;letter-spacing:5px;color:#b9f27c;text-transform:uppercase}
    #hook .title{margin:42px 0 0;font-size:92px;line-height:1.0;letter-spacing:-4px;font-weight:800;max-width:840px}
    #hook .sub{margin:32px 0 0;font-size:34px;line-height:1.35;color:#b9c2bd;max-width:760px}
  </style>
</head>
<body>
  <div id="hook" data-composition-id="hook" data-start="0" data-duration="8" data-width="1080" data-height="1920">
    <div class="wrap">
      <div class="kicker" data-slot="kicker">THE MOMENT</div>
      <h1 class="title" data-slot="hook">The moment everyone missed.</h1>
      <p class="sub" data-slot="sub">One line of context.</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.from('#hook .kicker', { autoAlpha: 0, y: 12, duration: .5, ease: 'power2.out' }, 0);
    tl.from('#hook .title', { autoAlpha: 0, y: 34, duration: .8, ease: 'power3.out' }, .12);
    tl.from('#hook .sub', { autoAlpha: 0, y: 18, duration: .6, ease: 'power2.out' }, .5);
    tl.set({}, {}, 8);
    window.__timelines['hook'] = tl;
  </script>
</body>
</html>
