<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    #lower-third{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;pointer-events:none;color:#f4f1ea;font-family:Inter,Arial,sans-serif}
    #lower-third .wrap{position:absolute;left:90px;right:150px;bottom:430px}
    #lower-third .bar{width:64px;height:4px;background:#b9f27c;margin-bottom:18px}
    #lower-third .name{font-size:40px;line-height:1.15;font-weight:800}
    #lower-third .role{margin-top:8px;font-size:26px;line-height:1.3;color:#b9c2bd}
  </style>
</head>
<body>
  <div id="lower-third" data-composition-id="lower-third" data-start="0" data-duration="8" data-width="1080" data-height="1920">
    <div class="wrap">
      <div class="bar"></div>
      <div class="name" data-slot="name">Guest name</div>
      <div class="role" data-slot="role">Role / context</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.from('#lower-third .bar', { autoAlpha: 0, scaleX: 0, transformOrigin: 'left center', duration: .4, ease: 'power2.out' }, 0);
    tl.from('#lower-third .name', { autoAlpha: 0, x: -18, duration: .45, ease: 'power2.out' }, .08);
    tl.from('#lower-third .role', { autoAlpha: 0, x: -18, duration: .45, ease: 'power2.out' }, .18);
    tl.set({}, {}, 8);
    window.__timelines['lower-third'] = tl;
  </script>
</body>
</html>
