<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    #ambient-bg{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;background:#080c12;pointer-events:none}
    #ambient-bg .base{position:absolute;inset:0;background:
      radial-gradient(ellipse at 76% 8%,#1d2b25 0%,transparent 55%),
      radial-gradient(ellipse at 8% 92%,#171a21 0%,transparent 55%),
      linear-gradient(180deg,#080c12 0%,#06090e 100%)}
    #ambient-bg .grid{position:absolute;inset:-10%;opacity:.16;background-image:
      linear-gradient(rgba(185,242,124,.18) 1px,transparent 1px),
      linear-gradient(90deg,rgba(185,242,124,.12) 1px,transparent 1px);
      background-size:72px 72px}
    #ambient-bg .grain{position:absolute;inset:-12%;opacity:.12;background-image:radial-gradient(#fff .6px,transparent .6px);background-size:7px 7px}
    #ambient-bg .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.55) 100%)}
  </style>
</head>
<body>
  <div id="ambient-bg" data-composition-id="ambient-bg" data-start="0" data-duration="8" data-width="1080" data-height="1920">
    <div class="base"></div>
    <div class="grid"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#ambient-bg .grid', { backgroundPosition: '0px 0px' }, { backgroundPosition: '72px 72px', duration: 8, ease: 'none' }, 0);
    tl.fromTo('#ambient-bg .grain', { backgroundPosition: '0px 0px', opacity: .10 }, { backgroundPosition: '21px 14px', opacity: .16, duration: 2, yoyo: true, repeat: 3, ease: 'steps(4)' }, 0);
    tl.fromTo('#ambient-bg .base', { scale: 1 }, { scale: 1.02, duration: 8, ease: 'none' }, 0);
    tl.set({}, {}, 8);
    window.__timelines['ambient-bg'] = tl;
  </script>
</body>
</html>
