<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    #payoff{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;pointer-events:none;color:#f4f1ea;font-family:Inter,Arial,sans-serif}
    #payoff .wrap{position:absolute;left:90px;right:150px;bottom:320px}
    #payoff .card{padding:30px 32px;border:1px solid rgba(185,242,124,.38);background:rgba(17,26,26,.86);border-radius:20px;font-size:32px;line-height:1.35;color:#e9efe9;max-width:780px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    #payoff .card strong{color:#b9f27c}
    #payoff .caption{margin:28px 0 0;font-size:31px;line-height:1.35;color:#f4f1ea;max-width:820px;border-left:4px solid #b9f27c;padding-left:22px}
  </style>
</head>
<body>
  <div id="payoff" data-composition-id="payoff" data-start="0" data-duration="8" data-width="1080" data-height="1920">
    <div class="wrap">
      <div class="card" data-slot="payoff">The payoff lands here.</div>
      <p class="caption" data-slot="caption">Exact spoken words go here.</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.from('#payoff .card', { autoAlpha: 0, y: 28, scale: .98, duration: .7, ease: 'power2.out' }, 0);
    tl.from('#payoff .caption', { autoAlpha: 0, x: -18, duration: .55, ease: 'power2.out' }, .35);
    tl.set({}, {}, 8);
    window.__timelines['payoff'] = tl;
  </script>
</body>
</html>
