<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>{{TITLE}}</title>
  <script src="assets/gsap.min.js"></script>
  <script src="assets/motionkit.js"></script>
  <link rel="stylesheet" href="assets/motionkit.css">
  <style>
    @font-face {
      font-family: "Poppins";
      src: url("assets/fonts/Poppins-Bold.ttf") format("truetype");
      font-weight: 700 900;
      font-style: normal;
    }
    @font-face {
      font-family: "Inter Tight";
      src: url("assets/fonts/InterTight.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("assets/fonts/JetBrainsMono.ttf") format("truetype");
      font-weight: 100 800;
      font-style: normal;
    }

    :root {
      --ink: #07090e;
      --gold: #ffe600;
      --gold-glow: rgba(255, 230, 0, 0.85);
      --green: #00ff66;
      --green-glow: rgba(0, 255, 102, 0.85);
      --red: #ff3b30;
      --red-glow: rgba(255, 59, 48, 0.90);
      --blue: #3b82f6;
      --blue-glow: rgba(59, 130, 246, 0.85);
      --text: #f5f2ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: "Inter Tight", -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #clip {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #000;
    }

    /* 1. Base Camera Layer - Crystal Clean Footage (No roto/cutout overlays!) */
    .cam {
      position: absolute;
      inset: 0;
      transform-origin: 50% 35%;
      z-index: 1;
    }

    .cam video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Head-level negative space stat (X > 540px to clear subject head) */
    .head-stat-wrap {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      z-index: 10;
    }

    /* 2. FOREGROUND BROADCAST GRAPHICS - CENTER CHEST (Y: 980px) */
    /* Strictly below chin (Y: 150-850px Face Sanctuary). Face is 100% clean. */
    #front {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 12;
    }

    .broadcast-center {
      position: absolute;
      top: 980px;
      left: 50%;
      transform: translateX(-50%);
      width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
    }

    .kicker-txt {
      font-family: "Inter Tight", sans-serif;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(245, 242, 234, 0.92);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
      margin-bottom: 12px;
    }

    .kicker-txt.gold { color: var(--gold); text-shadow: 0 0 15px rgba(255, 230, 0, 0.8), 0 2px 14px rgba(0, 0, 0, 0.95); }
    .kicker-txt.green { color: var(--green); text-shadow: 0 0 15px rgba(0, 255, 102, 0.8), 0 2px 14px rgba(0, 0, 0, 0.95); }
    .kicker-txt.red { color: var(--red); text-shadow: 0 0 15px rgba(255, 59, 48, 0.8), 0 2px 14px rgba(0, 0, 0, 0.95); }

    .hero-title {
      font-family: "Poppins", sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 0.92;
      letter-spacing: -0.03em;
      text-shadow: 0 4px 35px rgba(0, 0, 0, 0.98), 0 0 15px rgba(0, 0, 0, 0.9);
    }

    .hero-white {
      color: #ffffff;
      font-size: 96px;
    }

    .hero-gold {
      color: var(--gold);
      font-size: 96px;
      text-shadow: 0 0 15px #ffe600, 0 0 35px rgba(255, 230, 0, 0.9), 0 0 75px rgba(255, 200, 0, 0.6), 0 6px 30px rgba(0, 0, 0, 0.98);
    }

    .hero-green {
      color: var(--green);
      font-size: 110px;
      line-height: 0.88;
      text-shadow: 0 0 15px #00ff66, 0 0 40px rgba(0, 255, 102, 0.9), 0 0 85px rgba(0, 255, 102, 0.55), 0 6px 30px rgba(0, 0, 0, 0.98);
    }

    .hero-red {
      color: var(--red);
      font-size: 100px;
      text-shadow: 0 0 15px #ff3b30, 0 0 40px rgba(255, 59, 48, 0.95), 0 0 85px rgba(255, 59, 48, 0.6), 0 6px 30px rgba(0, 0, 0, 0.98);
    }

    .payoff-sub {
      font-family: "Inter Tight", sans-serif;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(245, 242, 234, 0.88);
      margin-top: 14px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
    }

    .payoff-sub.accent { color: var(--gold); }
    .payoff-sub.green { color: var(--green); }

    .rate-svg {
      width: 440px;
      height: 60px;
      margin: 8px 0;
      overflow: visible;
    }
    .rate-chart-line {
      fill: none;
      stroke: var(--green);
      stroke-width: 5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 12px rgba(0, 255, 102, 0.9));
    }

    .accent-bar {
      width: 80px;
      height: 4px;
      background: var(--gold);
      border-radius: 2px;
      margin: 10px 0;
      box-shadow: 0 0 15px var(--gold-glow);
    }
    .accent-bar.green {
      background: var(--green);
      box-shadow: 0 0 15px var(--green-glow);
    }
    .accent-bar.red {
      background: var(--red);
      box-shadow: 0 0 15px var(--red-glow);
    }

    /* 3. CREATOR KINETIC CAPTIONS (Anchored at Y: 1360px) */
    .mk-scrim {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 650px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.45) 50%, transparent 100%);
      pointer-events: none;
      z-index: 15;
    }

    .mk-caps {
      position: absolute;
      left: 40px;
      right: 40px;
      top: 1360px;
      height: 180px;
      z-index: 20;
      pointer-events: none;
    }

    .mk-cap {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      column-gap: 24px;
      row-gap: 8px;
    }

    .mk-cw {
      display: inline-block;
      font-family: "Poppins", sans-serif;
      font-size: 66px;
      font-weight: 900;
      line-height: 1.05;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      color: #ffffff;
      -webkit-text-stroke: 4px #000000;
      paint-order: stroke fill;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95), 0 2px 4px #000000;
      filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.9));
      margin: 0 4px;
    }

    .mk-cw.key {
      font-size: 74px;
      color: #ffe600 !important;
      -webkit-text-stroke: 4.5px #000000;
      paint-order: stroke fill;
      text-shadow:
        0 0 10px #ffe600,
        0 0 25px rgba(255, 230, 0, 0.95),
        0 0 50px rgba(255, 215, 0, 0.8),
        0 4px 15px rgba(0, 0, 0, 0.95);
      filter: drop-shadow(0 0 30px rgba(255, 230, 0, 0.75)) drop-shadow(0 8px 24px rgba(0, 0, 0, 0.95));
    }

    .mk-cw.key.neg {
      color: #ff3b30 !important;
      -webkit-text-stroke: 4.5px #000000;
      paint-order: stroke fill;
      text-shadow:
        0 0 10px #ff3b30,
        0 0 25px rgba(255, 59, 48, 0.95),
        0 0 50px rgba(255, 59, 48, 0.8),
        0 4px 15px rgba(0, 0, 0, 0.95);
      filter: drop-shadow(0 0 30px rgba(255, 59, 48, 0.75)) drop-shadow(0 8px 24px rgba(0, 0, 0, 0.95));
    }

    /* Live Preview Proxy Performance Modes (1/8 & 1/4) */
    .res-1-8 #clip * {
      text-shadow: none !important;
      box-shadow: none !important;
      filter: none !important;
      backdrop-filter: none !important;
    }
  </style>
</head>
<body>
  <div id="clip" data-composition-id="{{SLUG}}" data-width="1080" data-height="1920" data-duration="{{DURATION}}" data-fps="30">

    <!-- 1. BASE FOOTAGE CAMERA LAYER -->
    <div class="cam" id="cam">
      <!-- FOOTAGE:START -->
      <video id="main-video" src="assets/working.mp4" data-start="0" data-duration="{{DURATION}}" muted playsinline></video>
      <!-- FOOTAGE:END -->
    </div>

    <!-- 2. FOREGROUND BROADCAST GRAPHICS (CENTER CHEST) -->
    <div id="front">

      <!-- Beat 1: Hook Hero -->
      <div class="broadcast-center" id="hook-group">
        <div class="kicker-txt gold" id="hook-kicker">THE HOOK KICKER</div>
        <div class="hero-title hero-white" id="hook-sans">PRIMARY</div>
        <div class="hero-title hero-gold" id="hook-gold">HEADLINE</div>
        <div class="accent-bar" id="hook-bar"></div>
        <div class="payoff-sub accent" id="hook-sub">KEY VALUE PAYOFF</div>
      </div>

    </div>

    <!-- 3. LOWER-THIRD CAPTIONS -->
    <div class="mk-scrim" id="scrim"></div>
    <div class="mk-caps" id="caps"></div>

    <!-- 4. MASTER BROADCAST AUDIO STEM (Voice -14.6 LUFS + Ducked Music + Real SFX) -->
    <!-- AUDIO:START -->
    <audio id="mix-audio" src="assets/audio/mix.wav" data-start="0" data-duration="{{DURATION}}" data-track-index="8" data-volume="1.0"></audio>
    <!-- AUDIO:END -->

  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const MK = MotionKit(tl, { fps: 30 });

    tl.set('#cam', { scale: 1.0, transformOrigin: '50% 35%' }, 0);

    // ==========================================
    // BEAT 1: HOOK (1.00s - 3.00s)
    // ==========================================
    MK.zoom('#cam', 1.00, { to: 1.06, origin: '50% 35%', inDur: 0.35, hold: 1.6, outDur: 0.4 });

    tl.set('#hook-group', { opacity: 1 }, 1.00);
    tl.fromTo('#hook-kicker', { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.30, ease: 'power3.out' }, 1.02);
    tl.fromTo('#hook-sans', { opacity: 0, y: 30, scale: 0.88 }, { opacity: 1, y: 0, scale: 1.0, duration: 0.38, ease: 'back.out(2.2)' }, 1.08);
    tl.fromTo('#hook-gold', { opacity: 0, y: 30, scale: 0.88 }, { opacity: 1, y: 0, scale: 1.0, duration: 0.38, ease: 'back.out(2.2)' }, 1.18);
    tl.fromTo('#hook-bar', { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.35, ease: 'power3.out' }, 1.28);
    tl.fromTo('#hook-sub', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.32, ease: 'power3.out' }, 1.35);

    tl.to('#hook-group', { opacity: 0, y: -20, duration: 0.25, ease: 'power2.in' }, 2.95);

    // ==========================================
    // CONTINUOUS CREATOR KINETIC CAPTIONS
    // ==========================================
    const WORDS = [
      ["Hook", 0.0, 0.5],
      ["sentence", 0.5, 1.0],
      ["goes", 1.0, 1.5],
      ["here", 1.5, 2.0]
    ];

    MK.captions({
      words: WORDS,
      container: "#caps",
      end: {{DURATION}}
    });

    window.__timelines = window.__timelines || {};
    window.__timelines['{{SLUG}}'] = tl;
  </script>
</body>
</html>
