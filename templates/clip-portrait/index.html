<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{TITLE}}</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#080c12;color:#f4f1ea;font-family:Inter,Arial,sans-serif}
    #clip{position:relative;width:1080px;height:1920px;overflow:hidden;background:
      radial-gradient(ellipse at 75% 8%,#1d2b25 0%,transparent 55%),
      radial-gradient(ellipse at 10% 92%,#171a21 0%,transparent 55%),
      #080c12}
    #footage{position:absolute;inset:0;overflow:hidden;background:#000}
    #footage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    #footage .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,18,.82) 0%,rgba(8,12,18,.30) 42%,rgba(8,12,18,.88) 100%);pointer-events:none}
    #clip[data-has-footage="true"]{background:#080c12}
    #clip[data-has-footage="true"] #bg{background:transparent}
    #clip[data-has-footage="true"] #media{display:none}
    #bg > .grain{position:absolute;inset:0;opacity:.10;background-image:radial-gradient(#fff 0.6px,transparent 0.6px);background-size:7px 7px;pointer-events:none}
    #bg > .frame{position:absolute;inset:64px;border:1px solid rgba(185,242,124,.18);border-radius:28px;pointer-events:none}
    #clip > .media{position:absolute;left:90px;right:150px;top:760px;height:520px;border:1px dashed rgba(185,242,124,.28);border-radius:24px;background:rgba(255,255,255,.015);display:flex;align-items:center;justify-content:center}
    #clip > .media span{font:22px "Courier New",monospace;letter-spacing:3px;color:#8fa39a;text-transform:uppercase}
    #guides{display:none;position:absolute;left:90px;right:150px;top:200px;bottom:320px;border:1px dashed rgba(185,242,124,.55);pointer-events:none}
    body.show-guides #guides{display:block}
    #clip > .content{position:absolute;left:90px;right:150px;top:220px;bottom:320px;display:flex;flex-direction:column}
    #clip > .content > .kicker{font:24px "Courier New",monospace;letter-spacing:5px;color:#b9f27c;text-transform:uppercase}
    #clip > .content > .hook{margin:44px 0 0;font-size:88px;line-height:1.02;letter-spacing:-4px;font-weight:800;max-width:840px}
    #clip > .content > .sub{margin:34px 0 0;font-size:34px;line-height:1.35;color:#b9c2bd;max-width:760px}
    #clip > .content > .spacer{flex:1}
    #clip > .content > .payoff{align-self:flex-start;padding:26px 30px;border:1px solid rgba(185,242,124,.35);background:rgba(17,26,26,.82);border-radius:18px;font-size:30px;line-height:1.35;color:#e9efe9;max-width:780px}
    #clip > .content > .payoff strong{color:#b9f27c}
    #clip > .content > .caption{margin:30px 0 0;font-size:31px;line-height:1.35;color:#f4f1ea;max-width:820px;border-left:4px solid #b9f27c;padding-left:22px}
    #clip > .footer{position:absolute;left:90px;right:150px;bottom:96px;display:flex;justify-content:space-between;align-items:center;font:20px "Courier New",monospace;letter-spacing:2px;color:#7f8d86;text-transform:uppercase}
    #progress{position:absolute;left:0;bottom:0;width:100%;height:5px;background:#b9f27c;transform-origin:left center}
  </style>
</head>
<body>
  <div id="clip" data-composition-id="{{SLUG}}" data-duration="{{DURATION}}" data-width="1080" data-height="1920" data-has-footage="false">
    <!-- FOOTAGE:START -->
    <!-- FOOTAGE:END -->

    <div id="bg" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0">
      <div class="grain"></div>
      <div class="frame"></div>
      <div id="guides"></div>
    </div>

    <div id="media" class="media clip" data-start="0" data-duration="{{DURATION}}" data-track-index="1">
      <span>Footage / B-roll</span>
    </div>

    <div id="content" class="content clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">
      <div class="kicker">{{CHANNEL}} / CLIP 01</div>
      <h1 class="hook">{{HOOK}}</h1>
      <p class="sub">{{CONTEXT}}</p>
      <div class="spacer"></div>
      <div class="payoff">{{PAYOFF}}</div>
      <p class="caption">{{CAPTION}}</p>
    </div>

    <div id="footer" class="footer clip" data-start="0" data-duration="{{DURATION}}" data-track-index="3">
      <span>{{SOURCE_LABEL}}</span>
      <span>{{DURATION}}s</span>
    </div>

    <div id="progress" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="4"></div>

    <!-- AUDIO:START -->
    <!-- AUDIO:END -->

    <!-- LAYERS:START -->
    <!-- LAYERS:END -->
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    tl.from('.kicker', { opacity: 0, y: 12, duration: .5, ease: 'power2.out' }, 0);
    tl.from('.hook', { opacity: 0, y: 34, duration: .8, ease: 'power3.out' }, .15);
    tl.from('.sub', { opacity: 0, y: 18, duration: .6, ease: 'power2.out' }, .55);
    tl.from('.payoff', { opacity: 0, y: 26, scale: .98, duration: .7, ease: 'power2.out' }, 2.2);
    tl.from('.caption', { opacity: 0, x: -18, duration: .55, ease: 'power2.out' }, 3.0);
    tl.from('.footer', { opacity: 0, duration: .8, ease: 'power1.out' }, 3.4);
    tl.fromTo('#progress', { scaleX: 0 }, { scaleX: 1, duration: {{DURATION}}, ease: 'none' }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines['{{SLUG}}'] = tl;
  </script>
</body>
</html>
