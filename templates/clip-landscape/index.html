<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{TITLE}}</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#080c12;color:#f4f1ea;font-family:Inter,Arial,sans-serif}
    #clip{position:relative;width:1920px;height:1080px;overflow:hidden;background:
      radial-gradient(ellipse at 80% 10%,#1d2b25 0%,transparent 55%),
      radial-gradient(ellipse at 10% 90%,#171a21 0%,transparent 55%),
      #080c12}
    #footage{position:absolute;inset:0;overflow:hidden;background:#000}
    #footage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    #footage .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,12,18,.90) 0%,rgba(8,12,18,.55) 46%,rgba(8,12,18,.12) 78%,rgba(8,12,18,.55) 100%);pointer-events:none}
    #clip[data-has-footage="true"]{background:#080c12}
    #clip[data-has-footage="true"] #bg{background:transparent}
    #bg > .grain{position:absolute;inset:0;opacity:.10;background-image:radial-gradient(#fff 0.6px,transparent 0.6px);background-size:7px 7px;pointer-events:none}
    #bg > .frame{position:absolute;inset:64px;border:1px solid rgba(185,242,124,.18);border-radius:28px;pointer-events:none}
    #clip > .content{position:absolute;left:120px;top:150px;bottom:120px;width:1040px;display:flex;flex-direction:column}
    #clip > .content > .kicker{font:24px "Courier New",monospace;letter-spacing:5px;color:#b9f27c;text-transform:uppercase}
    #clip > .content > .hook{margin:44px 0 0;font-size:96px;line-height:1.02;letter-spacing:-4px;font-weight:800;max-width:980px}
    #clip > .content > .sub{margin:34px 0 0;font-size:34px;line-height:1.35;color:#b9c2bd;max-width:850px}
    #clip > .content > .spacer{flex:1}
    #clip > .content > .payoff{padding:26px 30px;border:1px solid rgba(185,242,124,.35);background:rgba(17,26,26,.82);border-radius:18px;font-size:30px;line-height:1.35;color:#e9efe9;max-width:850px}
    #clip > .content > .payoff strong{color:#b9f27c}
    #clip > .content > .caption{margin:26px 0 0;font-size:30px;line-height:1.35;color:#f4f1ea;max-width:860px;border-left:4px solid #b9f27c;padding-left:22px}
    #clip > .side{position:absolute;right:120px;top:150px;bottom:120px;width:520px;border-left:1px solid rgba(185,242,124,.18);padding-left:48px;display:flex;flex-direction:column;justify-content:flex-end}
    #clip > .side .label{font:20px "Courier New",monospace;letter-spacing:3px;color:#7f8d86;text-transform:uppercase}
    #clip > .side .source{margin-top:14px;font-size:28px;line-height:1.35;color:#b9c2bd}
    #clip > .footer{position:absolute;left:120px;right:120px;bottom:54px;display:flex;justify-content:space-between;font:20px "Courier New",monospace;letter-spacing:2px;color:#7f8d86;text-transform:uppercase}
    #progress{position:absolute;left:0;bottom:0;width:100%;height:5px;background:#b9f27c;transform-origin:left center}
  </style>
</head>
<body>
  <div id="clip" data-composition-id="{{SLUG}}" data-duration="{{DURATION}}" data-width="1920" data-height="1080" data-has-footage="false">
    <!-- FOOTAGE:START -->
    <!-- FOOTAGE:END -->

    <div id="bg" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0">
      <div class="grain"></div>
      <div class="frame"></div>
    </div>

    <div id="content" class="content clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">
      <div class="kicker">{{CHANNEL}} / CLIP 01</div>
      <h1 class="hook">{{HOOK}}</h1>
      <p class="sub">{{CONTEXT}}</p>
      <div class="spacer"></div>
      <div class="payoff">{{PAYOFF}}</div>
      <p class="caption">{{CAPTION}}</p>
    </div>

    <div id="side" class="side clip" data-start="0" data-duration="{{DURATION}}" data-track-index="12">
      <div class="label">Source</div>
      <div class="source">{{SOURCE_LABEL}}</div>
    </div>

    <div id="footer" class="footer clip" data-start="0" data-duration="{{DURATION}}" data-track-index="3">
      <span>{{CHANNEL}}</span>
      <span>{{DURATION}}s</span>
    </div>

    <div id="progress" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="4"></div>

    <!-- AUDIO:START -->
    <!-- AUDIO:END -->

    <!-- LAYERS:START -->
    <!-- LAYERS:END -->
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    tl.from('.kicker', { opacity: 0, y: 12, duration: .5, ease: 'power2.out' }, 0);
    tl.from('.hook', { opacity: 0, y: 34, duration: .8, ease: 'power3.out' }, .15);
    tl.from('.sub', { opacity: 0, y: 18, duration: .6, ease: 'power2.out' }, .55);
    tl.from('.payoff', { opacity: 0, y: 26, scale: .98, duration: .7, ease: 'power2.out' }, 2.2);
    tl.from('.caption', { opacity: 0, x: -18, duration: .55, ease: 'power2.out' }, 3.0);
    tl.from('.side', { opacity: 0, x: 24, duration: .7, ease: 'power2.out' }, 1.4);
    tl.from('.footer', { opacity: 0, duration: .8, ease: 'power1.out' }, 3.4);
    tl.fromTo('#progress', { scaleX: 0 }, { scaleX: 1, duration: {{DURATION}}, ease: 'none' }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines['{{SLUG}}'] = tl;
  </script>
</body>
</html>
