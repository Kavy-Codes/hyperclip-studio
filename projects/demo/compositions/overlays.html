<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="assets/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #overlays-root {
      position: relative;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
    }
    .demo-card {
      position: absolute;
      left: 540px;
      top: 1000px;
      transform: translate(-540px, 0);
      background: rgba(14, 22, 34, 0.92);
      border: 1px solid rgba(0, 229, 255, 0.4);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 229, 255, 0.15);
      border-radius: 20px;
      padding: 24px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
    }
    .demo-badge {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #00e5ff;
    }
    .demo-title {
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .demo-captions {
      position: absolute;
      left: 50%;
      top: 1380px;
      transform: translateX(-50%);
      width: 900px;
      text-align: center;
      font-size: 54px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 4px 16px rgba(0,0,0,0.9);
      letter-spacing: -1px;
    }
    .highlight {
      color: #ffd600;
    }
  </style>
</head>
<body>
  <div data-hf-id="hf-ov-root" id="overlays-root" data-composition-id="overlays" data-duration="5.0" data-width="1080" data-height="1920">
    <div data-hf-id="hf-card" id="card-hero" class="demo-card">
      <span class="demo-badge">HyperClip Engine</span>
      <span class="demo-title">Ready To Edit</span>
    </div>
    <div data-hf-id="hf-cap" id="captions" class="demo-captions">
      CODE-FIRST <span class="highlight">VIDEO STUDIO</span>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    
    // Animate card entrance at 0.5s
    tl.fromTo('#card-hero', 
      { opacity: 0, y: 40, scale: 0.95 },
      { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.5)' },
      0.5
    );

    // Subtle floating breath
    tl.to('#card-hero', { y: -8, duration: 1.5, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 1.0);

    // Animate captions
    tl.fromTo('#captions',
      { opacity: 0, scale: 0.9 },
      { opacity: 1, scale: 1, duration: 0.4, ease: 'power2.out' },
      0.8
    );

    window.__timelines = window.__timelines || {};
    window.__timelines['overlays'] = tl;
  </script>
</body>
</html>
